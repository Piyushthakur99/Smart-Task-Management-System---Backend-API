spring.application.name=taskmanager

# MongoDB Connection String (Spring Boot will auto-create the database)
spring.data.mongodb.uri=mongodb://localhost:27017/task_management_db

# JWT Configuration (Secret key and 24-hour expiration)
jwt.secret=MySecretKeyForTaskManagementSystemWhichNeedsToBeVeryLongAndSecure123!
jwt.expirationMs=86400000